name: Tests

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [11, 21]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Run tests
        run: mvn test --batch-mode

  release:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Publish GPG key to keyservers
        run: |
          KEY_ID=$(gpg --list-keys --keyid-format long --with-colons | grep '^pub' | cut -d':' -f5)
          echo "Publishing key $KEY_ID to keyservers..."
          gpg --keyserver keyserver.ubuntu.com --send-keys $KEY_ID
          gpg --keyserver keys.openpgp.org --send-keys $KEY_ID
          echo "Waiting for keyserver propagation..."
          for i in $(seq 1 12); do
            if gpg --keyserver keyserver.ubuntu.com --recv-keys $KEY_ID 2>&1 | grep -q "not changed\|imported"; then
              echo "Key found on keyserver after ${i}0 seconds"
              break
            fi
            sleep 10
          done

      - name: Publish to Maven Central
        run: mvn deploy --batch-mode -Prelease -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ""

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
